name: CI

# This repository makes one promise: every sample builds from published AEP binaries alone.
# Nothing checked that promise until this workflow existed - and an unchecked promise about a
# build is one that stops being true at the first convenient shortcut.
#
# It is also the only place a bad AEP release gets caught by something other than a person.
# If 0.5.1 ships a broken artifact, a sample pinned to it fails here rather than months later
# on someone's TV.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # A sample can break without anyone touching this repository - a toolchain moves underneath
  # it, or a vendored binary turns out not to be self-sufficient after all. Weekly is often
  # enough to notice, rare enough to ignore.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  check:
    name: Sample invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Vendored binaries present and matching each sample's declared AEP version; no dependency
      # on AEP platform source; experience rules free of renderer imports. Every sample, whatever
      # its renderer - samples declare themselves in sample.json rather than being inferred from
      # build files, so a Unity sample cannot pass through unnoticed.
      - name: Check every sample
        run: python3 tools/check_samples.py

      # AEP-04. Each sample's experience.json is validated against the canonical AEP schema:
      # its capability ids must be ones AmboKit publishes, and it must agree with the code
      # beside it. This is what caught RockDodge shipping as com.ambokit.aep.rockdodge on
      # Android and reference.rockdodge on Unity - one game, two ids, in anything that counts
      # them - which nothing here could see while capabilities were merely written down in
      # sample.json and read by no one.
      #
      # The validator and the schema are vendored from the AEP repository, beside the binaries
      # and for the same reason: that repository is private and a public CI run cannot check it
      # out. Vendored rather than rewritten, because two hand-written validators drifting apart
      # is precisely the defect this check exists to catch.
      - name: Experience manifests agree with their code
        run: |
          python3 tools/check_manifests.py \
            --root . \
            --schema tools/aep-experience-manifest-v1.schema.json \
            --catalogue tools/capability-catalogue.json

  build:
    name: Build every buildable sample from its own binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' skips sdkmanager installs - its default installs 'tools', which current
      # cmdline-tools no longer ship. The runner image already provides the SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      # Each sample is a standalone build with its own wrapper, so they are built one at a time
      # rather than as one multi-project build. That separation is the point: a sample that
      # needed this repository's cooperation to build would not be proving much.
      - name: Build Android samples
        run: |
          set -euo pipefail
          built=0
          while read -r sample; do
            [ -n "$sample" ] || continue
            echo "::group::$sample"
            ( cd "$sample" && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace )
            echo "::endgroup::"
            built=$((built + 1))
          done < <(python3 tools/list_samples.py --renderer android-tv)
          echo "Built $built Android sample(s) from vendored binaries."

      # Unity samples are structurally checked in the other job but cannot be compiled here:
      # Unity needs an editor and a licence this runner does not have. Stated rather than
      # skipped, so the gap stays visible instead of looking like coverage.
      - name: Report Unity samples as unbuilt
        run: |
          set -euo pipefail
          unity="$(python3 tools/list_samples.py --renderer unity)"
          if [ -z "$unity" ]; then
            echo "No Unity samples."
          else
            echo "$unity" | while read -r sample; do
              echo "::warning title=Unity sample not built::$sample is checked but not compiled - no Unity licence on this runner"
            done
          fi

      # A repository with no buildable samples is a broken discovery, not a quiet success.
      - name: Fail if nothing was discovered
        run: |
          set -euo pipefail
          total="$(python3 tools/list_samples.py | wc -l)"
          if [ "$total" -eq 0 ]; then
            echo "::error::no samples found - discovery is broken"
            exit 1
          fi
          echo "$total sample(s) discovered."
