org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Which AEP this sample is built against. The binaries in libs/ carry this version in their
# filenames, and the build reads it from here rather than hard-coding paths.
#
# AirDraw needs 0.8.0 as a floor, not a preference: camera.hand and input.touch could not be
# requested from an Android experience before it. The host hardcoded its own capability list
# and ignored what the experience declared.
aep.version=0.9.0
