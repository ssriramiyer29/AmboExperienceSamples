<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TouchDraw</title>
<style>
  :root { color-scheme: dark; --ink:#e8f4ff; --dim:#8fb0c4; --accent:#3ad6a4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #071522; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  /* One element, so a site embeds this sample by dropping this block in. The aspect ratio is a
     starting value only: main.ts replaces it with the pad's, so the mapping stays square. */
  .touchdraw { position: relative; width: min(1100px, 100%); aspect-ratio: 1991 / 900;
    max-height: calc(100vh - 32px); border-radius: 18px; overflow: hidden; background: #0b1d2e;
    box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: 100%; }
  .panel { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px;
    justify-items: center; text-align: center; background: rgba(7,21,34,.93); padding: 24px; }
  .panel h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.1rem); }
  .panel p { margin: 0; color: var(--dim); max-width: 46ch; }
  #qr { width: min(220px, 45vw); aspect-ratio: 1; border-radius: 12px; background: #fff; object-fit: contain; }
  #joinUrl { font: 12px/1.4 ui-monospace, monospace; color: var(--dim); overflow-wrap: anywhere; max-width: 40ch; }
  #hud { position: absolute; top: 0; left: 0; display: flex; gap: 12px; align-items: baseline;
    padding: 12px 16px; pointer-events: none; }
  #mode { font-weight: 800; letter-spacing: .02em; background: rgba(7,21,34,.72);
    padding: 4px 12px; border-radius: 99px; }
  #tally { font: 12px/1.4 ui-monospace, monospace; color: var(--accent); opacity: .85; }
  #message { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
    background: rgba(7,21,34,.9); padding: 12px 20px; border-radius: 14px; font-weight: 600;
    text-align: center; max-width: 80%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <!-- data-ambo-gateway overrides where the Gateway is; the default is this page's own origin. -->
  <div class="touchdraw" data-ambo-gateway="">
    <canvas id="stage"></canvas>

    <div id="hud"><span id="mode">Draw</span><span id="tally"></span></div>
    <div id="message" hidden></div>

    <div class="panel" id="join">
      <h1>TouchDraw</h1>
      <p>Your phone is the pen and the palette. Scan with the AmboKit Companion, then drag to draw.
         The buttons down the right switch between drawing and panning; the row along the bottom
         picks the ink.</p>
      <img id="qr" alt="Scan to draw on this canvas">
      <p id="joinState">Waiting for a phone…</p>
      <p id="joinUrl"></p>
    </div>
  </div>
  <script type="module" src="./dist/touchdraw.js"></script>
</body>
</html>
