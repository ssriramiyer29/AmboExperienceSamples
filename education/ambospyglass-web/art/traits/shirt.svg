<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Reference trait. Everything that takes the prompt's colour lives in id="tint" and defers to
       currentColor; the outline and the buttons are fixed and stay outside it. Drawn on the same
       200x300 canvas as the subject, so the two stack with no transform. -->
  <g id="tint">
    <rect x="62" y="130" width="76" height="72" rx="16" fill="currentColor"/>
    <rect x="44" y="142" width="18" height="34" rx="8" fill="currentColor"/>
    <rect x="138" y="142" width="18" height="34" rx="8" fill="currentColor"/>
  </g>
  <rect x="62" y="130" width="76" height="72" rx="16" fill="none" stroke="#16222e" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="100" cy="158" r="3" fill="#16222e"/>
  <circle cx="100" cy="180" r="3" fill="#16222e"/>
</svg>
