org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Which AEP this sample is built against. The binaries in libs/ carry this version in their
# filenames, and the build reads it from here rather than hard-coding paths - so bumping AEP
# is one edit plus three replaced files.
#
# Samples deliberately pin different versions over time. That is what turns this repository
# into a compatibility matrix instead of a snapshot.
aep.version=0.6.0
